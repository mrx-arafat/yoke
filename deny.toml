# License and source policy, enforced with `cargo deny check`.
# Only permissive licenses are allowed anywhere in the dependency graph.

[advisories]
# No ignored advisories: vulnerabilities fail the check, including transitive dependencies.
# A yanked crate needs review rather than silently remaining in a release lockfile.
yanked = "deny"
unmaintained = "all"
unsound = "all"

[bans]
# Different major versions can be required by transitive APIs; keep them visible,
# rather than forcing incompatible upgrades or hiding them with skip entries.
multiple-versions = "warn"
wildcards = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"

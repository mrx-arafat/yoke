# Yoke configuration.
#
# Review this file with `yoke trust` in your own terminal before it runs.
# Observe logs what would be blocked. To block actions, change mode to
# "enforce" and trust the changed snapshot again.
#
# Gate commands receive YOKE_EVENT, YOKE_GATE, YOKE_TOOL_NAME,
# YOKE_TOOL_INPUT (JSON), YOKE_SESSION, YOKE_CWD, and YOKE_PROJECT.

mode = "observe"

[meta]
name = "my-project"

[[gate]]
name = "no-force-push"
on = "pre_tool_use"
match_tool = "Bash"
match_contains = "push --force"
action = "deny"
message = "Force push is blocked by Yoke. Push without --force."


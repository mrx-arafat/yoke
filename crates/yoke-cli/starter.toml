# Yoke configuration.
#
# Review this file with `yoke trust` in your own terminal before it runs.
# Observe logs what would be blocked. To block actions, change mode to
# "enforce" and trust the changed snapshot again.
#
# Gate commands receive YOKE_EVENT, YOKE_GATE, YOKE_TOOL_NAME,
# YOKE_TOOL_INPUT (JSON), YOKE_SESSION, YOKE_CWD, and YOKE_PROJECT.

mode = "observe"

[meta]
name = "my-project"

# Memory (optional). `yoke recall --explain` shows what a new session would be given and
# whether injection is active. Session digests stay off until you enable them here.
# [memory]
# digest = true             # let an agent CLI summarize each session into memory
# digest_agent = "claude"   # or "codex"
# inject_tokens = 1500      # budget for what a session start injects

[[gate]]
name = "no-force-push"
on = "pre_tool_use"
match_tool = "Bash|exec_command|shell_command|shell"
# Same matcher as git-safety's force-push gate; a heuristic, not a shell parser.
match_pattern = '\bgit(?:\s+(?:-C|-c|--git-dir|--work-tree)\s+[^\s;]+)*\s+push\b[^;\n]*\s(?:--force(?:-with-lease)?(?:[=\s\x22]|$)|-[A-Za-z]*f[A-Za-z]*(?:[\s\x22]|$)|\+[^\s\x22]+)'
action = "deny"
message = "Force push is blocked by Yoke. Push without --force."


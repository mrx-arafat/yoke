# Yoke configuration.
#
# Gates run on agent lifecycle events. On blocking events
# (pre_tool_use, user_prompt_submit, stop), a gate whose `run`
# command exits non-zero vetoes the action. On other events a
# failing gate is reported but does not block.
#
# Gate commands receive YOKE_EVENT, YOKE_GATE, YOKE_TOOL_NAME
# and YOKE_TOOL_INPUT (JSON) in their environment.

[meta]
name = "my-project"

[[gate]]
name = "no-force-push"
on = "pre_tool_use"
match_tool = "Bash"
match_contains = "push --force"
run = "exit 1"
message = "Force push is blocked by Yoke. Push without --force."

[[gate]]
name = "format-after-edit"
on = "post_tool_use"
match_tool = "Edit"
run = "cargo fmt --quiet 2>/dev/null || true"

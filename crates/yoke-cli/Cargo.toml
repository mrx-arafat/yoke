[package]
name = "yoke-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[[bin]]
name = "yoke"
path = "src/main.rs"

[dependencies]
yoke-core = { path = "../yoke-core", version = "0.1.0" }
serde_json.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
sha2.workspace = true
tempfile.workspace = true
toml_edit.workspace = true
pulldown-cmark.workspace = true
libc.workspace = true

[features]
# Makes a hook honour HOME even when it differs from the account's home. Dev and test builds
# (debug assertions on) already do. Build an optimized binary for an isolated run with
# `--features honor-home-env`. Never enable it in release.yml or the installer: the shipped
# binary ignores an injected HOME so a settings file cannot move Yoke's state.
honor-home-env = []

[dev-dependencies]
rusqlite.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(yoke_release_notices)"] }

[workspace]
resolver = "2"
members = ["crates/yoke-cli", "crates/yoke-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A harness that steers coding agents with configurable quality gates."

[workspace.dependencies]
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
toml = "0.8.19"
anyhow = "1.0.89"
clap = { version = "4.5.20", features = ["derive"] }

[workspace]
resolver = "2"
members = ["crates/yoke-cli", "crates/yoke-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Local, trusted quality gates for Claude Code and Codex."
repository = "https://github.com/mrx-arafat/yoke"
homepage = "https://github.com/mrx-arafat/yoke"
readme = "README.md"
keywords = ["claude-code", "codex", "ai-agent", "quality-gate", "hooks"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
toml = "0.8.19"
anyhow = "1.0.89"
clap = { version = "4.5.20", features = ["derive"] }
regex = "1.13.1"
rusqlite = { version = "0.32.1", features = ["bundled"] }
sha2 = "0.10.9"
tempfile = "3.27.0"
libc = "0.2.186"
toml_edit = "0.22.27"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install stable Rust with rustfmt
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install stable Rust with clippy
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: Lint with warnings denied
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Run the full test suite
        # Tests marked #[ignore] (the synthetic soak trial and the real-reviewer
        # checks) are skipped by default and only run with an explicit --ignored.
        run: |
          sh scripts/test-isolated-home-selftest.sh
          sh scripts/test-isolated-home.sh cargo test --workspace --locked
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Bounded hook performance regression
        run: uv run --no-project python scripts/benchmark_hooks.py --ci

  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install stable Rust and cargo-deny
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo install cargo-deny --locked --version 0.20.2
      - name: Check advisories, bans, licenses, and sources
        run: cargo deny check

  docs-and-scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Lint the install script
        run: shellcheck install.sh
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Validate the generated changelog
        run: uv run --no-project python scripts/changelog.py --check
      - name: Run release packaging unit tests
        run: uv run --no-project python -m unittest discover -s scripts/release -p 'test_*.py' -q
      - name: Check Markdown links, anchors, and dashes
        run: |
          uv run --no-project python -m unittest discover -s scripts -p 'test_check_docs.py' -q
          uv run --no-project python scripts/check_docs.py

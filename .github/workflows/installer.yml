name: Installer

on:
  push:
    paths:
      - install.sh
      - .github/workflows/installer.yml
  pull_request:
    paths:
      - install.sh
      - .github/workflows/installer.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-root:
    name: ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:24.04
          - ubuntu:22.04
          - debian:12
          - fedora:41
          - rockylinux:9
          - amazonlinux:2023
          - opensuse/leap:15.6
          - alpine:3.20
          - archlinux:latest
    # A fresh server: root, no compiler, no Rust, no terminal.
    container: ${{ matrix.image }}
    defaults:
      run:
        shell: sh
    steps:
      # Test scaffolding only: minimal images lack curl, which the one-line install needs.
      # The installer itself must install the compiler and Rust.
      - name: Install curl as on a minimal server
        run: |
          if ! command -v curl >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update -qq && apt-get install -y -qq curl ca-certificates
            elif command -v dnf >/dev/null 2>&1; then
              dnf install -y curl ca-certificates
            elif command -v zypper >/dev/null 2>&1; then
              zypper --non-interactive install curl ca-certificates
            elif command -v pacman >/dev/null 2>&1; then
              pacman -Sy --noconfirm --needed curl ca-certificates
            elif command -v apk >/dev/null 2>&1; then
              apk add curl ca-certificates
            fi
          fi
      # This commit's install.sh, fetched with curl because JavaScript actions such as
      # checkout do not run in every minimal image.
      - name: Install Yoke as root with every question answered yes
        env:
          REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          YOKE_YES: "1"
          # Build exactly the commit this run tests: with no release yet the installer would
          # otherwise build whatever main is now, and CI would not be testing this change.
          YOKE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p "$HOME/.claude"
          curl -fsSL "https://raw.githubusercontent.com/$REPOSITORY/$COMMIT/install.sh" -o /tmp/install.sh
          run_install() { if command -v bash >/dev/null 2>&1; then bash </tmp/install.sh; else sh </tmp/install.sh; fi; }
          # sh has no pipefail, so keep the installer's own exit status.
          { run_install 2>&1; echo $? >/tmp/install.status; } | tee /tmp/install.log
          test "$(cat /tmp/install.status)" -eq 0
      - name: Check the executable, the Claude hooks and the state schema
        env:
          REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(command -v yoke)" = /usr/local/bin/yoke
          # The installer built the commit under test, and the binary is that commit's version.
          grep -F "building the commit you asked for: $COMMIT" /tmp/install.log
          expected=$(curl -fsSL "https://raw.githubusercontent.com/$REPOSITORY/$COMMIT/Cargo.toml" | sed -n 's/^version = "\(.*\)"$/\1/p' | head -n 1)
          test -n "$expected"
          version=$(yoke --version)
          echo "$version"
          case $version in *"$expected"*) ;; *) echo "yoke --version is not $expected"; exit 1 ;; esac
          grep -F "/usr/local/bin/yoke' run-hook --agent claude PreToolUse" "$HOME/.claude/settings.json"
          # A fresh install gives Claude Code Yoke's statusline, which is also what records its quota.
          grep -F '"statusLine"' "$HOME/.claude/settings.json"
          grep -F "/usr/local/bin/yoke' statusline" "$HOME/.claude/settings.json"
          yoke health >/tmp/health.txt || true
          cat /tmp/health.txt
          # The installer migrates the database to the schema this executable supports.
          line=$(grep '^state:' /tmp/health.txt)
          schema=${line##* schema=}
          schema=${schema%% *}
          supported=${line##* supported=}
          test -n "$schema" && test "$schema" = "$supported"

  linux-user:
    name: ubuntu:24.04 as a user with sudo
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # A server login that is not root: passwordless sudo, no compiler, no Rust, no terminal.
    container: ubuntu:24.04
    defaults:
      run:
        shell: bash
    steps:
      # Test scaffolding only: the image has no curl, no sudo and no user to log in as.
      - name: Create a user with passwordless sudo and a fake Claude Code directory
        run: |
          apt-get update -qq && apt-get install -y -qq curl ca-certificates sudo
          useradd -m -s /bin/bash dev
          echo 'dev ALL=(ALL) NOPASSWD:ALL' >/etc/sudoers.d/dev
          chmod 440 /etc/sudoers.d/dev
          install -d -o dev -g dev /home/dev/.claude
          # Without a compiler, the installer has to ask sudo for one.
          if command -v cc; then echo "the image already has a C compiler"; exit 1; fi
      - name: Fetch this commit's install.sh
        env:
          REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: curl -fsSL "https://raw.githubusercontent.com/$REPOSITORY/$COMMIT/install.sh" -o /tmp/install.sh
      # YOKE_FROM_SOURCE keeps the compiler path under test once a release is published.
      - name: Install Yoke as that user with every question answered yes
        env:
          YOKE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        # YOKE_COMMIT builds the commit under test from source, so the compiler path stays tested.
        run: su - dev -c "YOKE_YES=1 YOKE_COMMIT=$YOKE_COMMIT bash </tmp/install.sh" 2>&1 | tee /tmp/install-user.log
      - name: Check the sudo compiler install, the user binary, PATH, hooks and schema
        env:
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          grep -F 'installing a C compiler with sudo' /tmp/install-user.log
          grep -F "building the commit you asked for: $COMMIT" /tmp/install-user.log
          su - dev -c '/home/dev/.local/bin/yoke --version'
          command -v cc
          test -x /home/dev/.local/bin/yoke
          test ! -e /usr/local/bin/yoke
          # shellcheck disable=SC2016 # the line is written with a literal $PATH
          marked='export PATH="/home/dev/.local/bin:$PATH"  # added by yoke install.sh'
          grep -Fx "$marked" /home/dev/.bashrc
          grep -F "/home/dev/.local/bin/yoke' run-hook --agent claude PreToolUse" /home/dev/.claude/settings.json
          grep -F '"statusLine"' /home/dev/.claude/settings.json
          grep -F "/home/dev/.local/bin/yoke' statusline" /home/dev/.claude/settings.json
          su - dev -c '/home/dev/.local/bin/yoke health' >/tmp/health.txt || true
          cat /tmp/health.txt
          # The installer migrates the database to the schema this executable supports.
          line=$(grep '^state:' /tmp/health.txt)
          schema=${line##* schema=}
          schema=${schema%% *}
          supported=${line##* supported=}
          test -n "$schema" && test "$schema" = "$supported"
          # YOKE_YES answers the installer's questions but never trusts a policy.
          grep -F '/.yoke/config.toml",false,false' /tmp/health.txt
      - name: Rerun with the install directory off PATH to check the PATH line stays single
        env:
          YOKE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          su - dev -c "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin YOKE_YES=1 YOKE_COMMIT=$YOKE_COMMIT bash </tmp/install.sh" 2>&1 | tee /tmp/install-user2.log
          grep -F 'already adds /home/dev/.local/bin to PATH' /tmp/install-user2.log
          grep -F 'changes: 0' /tmp/install-user2.log
          test "$(grep -c 'added by yoke install.sh' /home/dev/.bashrc)" = 1

  linux-interactive:
    name: ubuntu:24.04 in a terminal
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Runs only here, on a throwaway container, with expect typing as the human. The product
    # refuses yoke trust without a terminal and inside agents, and this keeps both guards.
    container: ubuntu:24.04
    defaults:
      run:
        shell: bash
    steps:
      # Test scaffolding only: curl fetches the installer, expect plays the person at the terminal.
      - name: Install curl and expect, and make a fake Claude Code directory with a statusline
        run: |
          apt-get update -qq && apt-get install -y -qq curl ca-certificates expect
          mkdir -p "$HOME/.claude"
          # A statusline the user already has: the installer must keep it unless asked to wrap it.
          printf '%s\n' '{"statusLine":{"type":"command","command":"echo user-statusline"}}' >"$HOME/.claude/settings.json"
      - name: Fetch this commit's install.sh
        env:
          REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: curl -fsSL "https://raw.githubusercontent.com/$REPOSITORY/$COMMIT/install.sh" -o /tmp/install.sh
      - name: Write the terminal driver
        run: |
          cat >/tmp/drive.exp <<'EOF'
          # Runs $DRIVE_CMD in a pseudo-terminal the way a person would: Enter for every
          # [Y/n] and [y/N] question, and the exact phrase that yoke trust asks for.
          set timeout 2400
          set asked {}
          set typed_phrase 0
          spawn bash -c $env(DRIVE_CMD)
          expect {
              -re {yoke-install: ([^\r\n]*)\[Y/n\] $} {
                  lappend asked $expect_out(1,string)
                  send "\r"
                  exp_continue
              }
              -re {yoke-install: ([^\r\n]*)\[y/N\] $} {
                  lappend asked $expect_out(1,string)
                  send "\r"
                  exp_continue
              }
              -re {Type (\S+) to confirm: $} {
                  set typed_phrase 1
                  send "$expect_out(1,string)\r"
                  exp_continue
              }
              timeout {
                  puts "\nFAIL: timed out waiting for the installer"
                  exit 2
              }
              eof
          }
          lassign [wait] pid spawned os_error status
          puts "\nINSTALLER EXIT STATUS: $status"
          puts "QUESTIONS ANSWERED: [llength $asked]"
          foreach question $asked { puts "  - $question" }
          if {$status != 0} { exit $status }
          foreach want $env(DRIVE_EXPECT) {
              set found 0
              foreach question $asked {
                  if {[string first $want $question] >= 0} { set found 1 }
              }
              if {!$found} {
                  puts "FAIL: the installer never asked about: $want"
                  exit 3
              }
          }
          if {!$typed_phrase} {
              puts "FAIL: yoke trust never asked for its confirmation phrase"
              exit 4
          }
          EOF
      - name: Install Yoke in a terminal, pressing Enter at every question
        env:
          # A directory off PATH, so the PATH question is asked as well.
          YOKE_INSTALL_DIR: /opt/yoke/bin
          YOKE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          DRIVE_CMD: cat /tmp/install.sh | bash
          DRIVE_EXPECT: "{C compiler} Cargo PATH {wrap it so Yoke's line comes first} {global policy}"
        run: expect /tmp/drive.exp 2>&1 | tee /tmp/install-terminal.log
      - name: Check that the typed confirmation trusted the starter global policy
        env:
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test -x /opt/yoke/bin/yoke
          grep -F "building the commit you asked for: $COMMIT" /tmp/install-terminal.log
          /opt/yoke/bin/yoke --version
          grep -F '# Yoke preset: git-safety' "$HOME/.yoke/config.toml"
          # Enter at the statusline question keeps the user's own command untouched.
          grep -F 'echo user-statusline' "$HOME/.claude/settings.json"
          # bash -e ignores a bare "! grep", so test the match explicitly.
          if grep -F "yoke' statusline" "$HOME/.claude/settings.json"; then
            echo "the installer replaced the user's own statusline"
            exit 1
          fi
          # shellcheck disable=SC2016 # the line is written with a literal $PATH
          grep -Fx 'export PATH="/opt/yoke/bin:$PATH"  # added by yoke install.sh' "$HOME/.bashrc"
          /opt/yoke/bin/yoke health >/tmp/health.txt || true
          cat /tmp/health.txt
          # The installed executable and its database agree on the schema.
          line=$(grep '^state:' /tmp/health.txt)
          schema=${line##* schema=}
          schema=${schema%% *}
          supported=${line##* supported=}
          test -n "$schema" && test "$schema" = "$supported"
          grep -F '/.yoke/config.toml",true,false' /tmp/health.txt

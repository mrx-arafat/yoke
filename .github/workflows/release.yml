name: Release packages

on:
  push:
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install stable Rust and license checker
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add '${{ matrix.target }}'
          cargo install cargo-deny --locked
      - name: Check licenses and sources
        run: cargo deny check licenses sources
      - name: Focused updater and packaging checks
        run: |
          cargo test --locked -p yoke-cli update:: --quiet
          uv run --no-project python -m unittest discover -s scripts/release -p 'test_*.py' -q
      - name: Generate embedded notices and validate tag
        shell: bash
        run: |
          args=()
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then args=(--tag "$GITHUB_REF_NAME"); fi
          uv run --no-project python scripts/release/package.py \
            --target '${{ matrix.target }}' --notices-only \
            --out "$RUNNER_TEMP/THIRD_PARTY_LICENSES" "${args[@]}"
      - name: Build with embedded license notices
        env:
          RUSTFLAGS: --cfg yoke_release_notices --check-cfg=cfg(yoke_release_notices)
        run: |
          YOKE_RELEASE_NOTICES="$RUNNER_TEMP/THIRD_PARTY_LICENSES" \
            cargo build --locked --release -p yoke-cli --target '${{ matrix.target }}'
      - name: Bundle licenses and checksum every asset
        run: >-
          uv run --no-project python scripts/release/package.py
          --target '${{ matrix.target }}'
          --binary 'target/${{ matrix.target }}/release/yoke'
          --out 'dist/${{ matrix.target }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: yoke-${{ matrix.target }}
          path: dist/${{ matrix.target }}/*
          if-no-files-found: error

  draft:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: yoke-*
          path: dist
          merge-multiple: true
      - name: Prepare draft for human release review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft \
            --title "Yoke $RELEASE_TAG" \
            --notes 'Download the archive for your platform to receive the executable and readable license notices. Raw updater executables also embed those notices. Review COMPLIANCE.md before publishing this draft.'
